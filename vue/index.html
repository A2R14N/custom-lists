<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#08090b" />
    <meta
      name="description"
      content="Bring MDBList, TMDB, WeTrakr and IMDb lists to Stremio and Nuvio. Organize your collection with your data in your own storage."
    />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32-v1.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/brand/favicon-64-v1.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon-v1.png" />
    <title>Custom Lists — Your lists, ready to watch.</title>
    <style>
      html {
        color-scheme: dark;
        background: #08090b;
      }
      body {
        margin: 0;
        background: #08090b;
      }
      .boot-message {
        max-width: 420px;
        margin: 18vh auto;
        padding: 28px;
        font:
          14px/1.7 system-ui,
          sans-serif;
        color: #f1f3f5;
      }
      .boot-message h1 {
        font-size: 28px;
        letter-spacing: -1px;
      }
      .boot-message p {
        color: #a0a7b2;
      }
      .boot-help {
        opacity: 0;
        animation: show-help 0s 8s forwards;
      }
      @keyframes show-help {
        to {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot-message">
        <img src="/brand/custom-lists-mark-v1.png" width="48" height="48" alt="" />
        <h1>Custom Lists.</h1>
        <p>Opening your collection…</p>
        <p class="boot-help">
          Taking longer than expected? Try reloading. If a content blocker is stopping
          this site’s scripts, review its settings for this site. Your saved lists are
          unchanged.
        </p>
        <noscript
          ><p>
            JavaScript is required to configure your addon. Your existing installed
            catalogs still work.
          </p></noscript
        >
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
